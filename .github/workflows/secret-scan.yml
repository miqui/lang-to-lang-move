name: Secret Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    name: Scan for leaked secrets
    runs-on: ubuntu-latest
    steps:
      # v6.0.2 (https://github.com/actions/checkout/releases/tag/v6.0.2)
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # betterleaks scans git history, not just the working tree
          fetch-depth: 0

      - name: Run Betterleaks
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            ghcr.io/betterleaks/betterleaks:1.8.1 \
            git . \
            --redact \
            --report-path betterleaks-report.json \
            --report-format json
          # exits non-zero (failing this job) when a finding is detected

      # v7.0.1 (https://github.com/actions/upload-artifact/releases/tag/v7.0.1)
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: betterleaks-report
          path: betterleaks-report.json
          retention-days: 14
